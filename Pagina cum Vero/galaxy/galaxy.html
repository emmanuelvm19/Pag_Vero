<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nunito:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0620; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 2.4s ease; cursor: grab; touch-action: none; }
  canvas.listo { opacity: 1; }
  canvas.arrastrando { cursor: grabbing; }

  #mensaje {
    position: fixed; left: 0; right: 0; bottom: 9vh; text-align: center; pointer-events: none;
    font: 600 clamp(32px, 6vw, 60px) "Dancing Script", cursive; color: #fff0fa;
    text-shadow: 0 0 12px #ff8fd8, 0 0 34px #c58cff;
    opacity: 0; transition: opacity 2.5s ease 1.6s;
  }
  #info {
    position: fixed; top: 18px; left: 0; right: 0; text-align: center; pointer-events: none;
    font: 600 14px "Nunito", sans-serif; color: rgba(255, 235, 250, .75); letter-spacing: .03em;
    opacity: 0; transition: opacity 1.5s ease 1s;
  }
  body.listo #mensaje, body.listo #info { opacity: 1; }
  body.sin-ayuda #info { opacity: 0; transition-delay: 0s; }

  .boton--regresar {
    position: fixed; right: 20px; bottom: 20px; z-index: 10;
    display: inline-flex; align-items: center; padding: 11px 24px;
    font: 600 16px "Nunito", sans-serif; color: #fff !important; text-decoration: none !important;
    background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .35); border-radius: 999px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 0 18px rgba(255, 140, 220, .35);
    transition: transform .2s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .boton--regresar:hover { background: rgba(255, 255, 255, .26); transform: translateY(-2px); box-shadow: 0 0 26px rgba(255, 140, 220, .6); }
  .boton--regresar:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  a.boton--regresar:visited, a.boton--regresar:active { color: #fff !important; text-decoration: none !important; }
  @media (prefers-reduced-motion: reduce) { canvas, #mensaje, #info { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Arrastra para girar · Rueda para acercar</div>
<div id="mensaje"></div>
<a href="../main/main.html" class="boton--regresar" id="back--btn">Volver</a>

<script>
// ✏️ Escribe aquí tu mensaje (déjalo vacío "" si no quieres mensaje)
const MENSAJE = "Pollas gordas ♡";

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, dpr, neb;

// ---------- Paleta ----------
const COLORES = [
  [255, 150, 215],   // rosa chicle
  [200, 160, 255],   // lila
  [150, 225, 255],   // celeste
  [255, 245, 252]    // blanco perlado
];

// ---------- Sprites de brillo ----------
const sprites = COLORES.map(([r, g, b]) => {
  const s = document.createElement("canvas"); s.width = s.height = 64;
  const x = s.getContext("2d");
  const g2 = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g2.addColorStop(0, `rgba(255,255,255,1)`);
  g2.addColorStop(.18, `rgba(${r},${g},${b},.9)`);
  g2.addColorStop(.5, `rgba(${r},${g},${b},.22)`);
  g2.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = g2; x.fillRect(0, 0, 64, 64);
  return s;
});

// ---------- Estrellas en espiral ----------
const N = 9000, BRAZOS = 3, RMAX = 180, DISP = 15;
const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
const col = new Uint8Array(N), fase = new Float32Array(N), vel = new Float32Array(N), tam = new Float32Array(N);

for (let i = 0; i < N; i++) {
  const radio = Math.pow(Math.random(), 3) * RMAX;
  const aBrazo = ((i % BRAZOS) / BRAZOS) * Math.PI * 2;
  const aEsp = radio * 0.04;
  const caos = DISP * (RMAX / (radio + 10));
  px[i] = Math.cos(aBrazo + aEsp) * radio + (Math.random() - .5) * caos;
  py[i] = (Math.random() - .5) * DISP * 0.3;
  pz[i] = Math.sin(aBrazo + aEsp) * radio + (Math.random() - .5) * caos;

  const p = radio / RMAX;
  col[i] = Math.random() < .12 ? 3 : (p < .35 ? 0 : p < .75 ? 1 : 2);
  fase[i] = Math.random() * 6.283;
  vel[i] = .6 + Math.random() * 2;
  tam[i] = Math.random() < .04 ? 2.2 : 0.7 + Math.random() * .6;
}

// ---------- Fondo nebuloso (se dibuja una sola vez) ----------
function crearNebulosa() {
  neb = document.createElement("canvas");
  neb.width = Math.round(W * 1.2); neb.height = Math.round(H * 1.2);
  const x = neb.getContext("2d");
  const f = x.createRadialGradient(neb.width / 2, neb.height / 2, 0, neb.width / 2, neb.height / 2, Math.max(neb.width, neb.height) * .7);
  f.addColorStop(0, "#2d1457"); f.addColorStop(.55, "#150a38"); f.addColorStop(1, "#080418");
  x.fillStyle = f; x.fillRect(0, 0, neb.width, neb.height);
  x.globalCompositeOperation = "screen";
  const nubes = [[.3,.35,.38,"255,120,200",.22],[.72,.3,.34,"150,120,255",.22],[.6,.72,.4,"110,200,255",.15],
                 [.2,.75,.3,"200,130,255",.16],[.85,.8,.28,"255,150,210",.14],[.5,.5,.25,"255,140,220",.14]];
  for (const [nx, ny, nr, c, a] of nubes) {
    const R = nr * Math.max(neb.width, neb.height) * .6;
    const g = x.createRadialGradient(nx * neb.width, ny * neb.height, 0, nx * neb.width, ny * neb.height, R);
    g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`);
    x.fillStyle = g; x.fillRect(0, 0, neb.width, neb.height);
  }
}

function ajustar() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  crearNebulosa();
}
addEventListener("resize", ajustar);
ajustar();

// ---------- Cámara (arrastre, rueda y touch) ----------
let theta = 0, phi = Math.PI / 4, r = 30;
let thetaT = theta, phiT = phi, rT = r;
let arrastrando = false, lx = 0, ly = 0;

function inicio(x, y) { arrastrando = true; lx = x; ly = y; cv.classList.add("arrastrando"); document.body.classList.add("sin-ayuda"); }
function mover(x, y) {
  if (!arrastrando) return;
  thetaT -= (x - lx) * 0.007;
  phiT = Math.max(0.1, Math.min(Math.PI - 0.1, phiT - (y - ly) * 0.007));
  lx = x; ly = y;
}
function fin() { arrastrando = false; cv.classList.remove("arrastrando"); }

addEventListener("mousedown", e => { if (e.target === cv) inicio(e.clientX, e.clientY); });
addEventListener("mousemove", e => mover(e.clientX, e.clientY));
addEventListener("mouseup", fin);
cv.addEventListener("touchstart", e => inicio(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
addEventListener("touchmove", e => mover(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
addEventListener("touchend", fin);
addEventListener("wheel", e => { rT = Math.max(12, Math.min(180, rT + e.deltaY * 0.03)); }, { passive: true });

// ---------- Estrellas fugaces ----------
const fugaces = [];
let proxFugaz = 2;
function nuevaFugaz() {
  const ang = Math.PI * (0.15 + Math.random() * 0.15);
  fugaces.push({ x: Math.random() * W * .8, y: Math.random() * H * .4, vx: Math.cos(ang) * 900, vy: Math.sin(ang) * 900, vida: 0, dur: .9 });
}

// ---------- Mensaje ----------
document.getElementById("mensaje").textContent = MENSAJE;

// ---------- Render ----------
let t0 = performance.now(), tPrev = t0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - tPrev) / 1000, .05); tPrev = now;
  const t = (now - t0) / 1000;

  if (!arrastrando && !reducir) thetaT += 0.0009 * dt * 60;
  theta += (thetaT - theta) * 0.12;
  phi += (phiT - phi) * 0.12;
  r += (rT - r) * 0.12;

  // Fondo
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.drawImage(neb, -W * .1 + Math.sin(theta) * W * .03, -H * .1 + (phi - Math.PI / 4) * H * .05, neb.width, neb.height);

  const cosT = Math.cos(theta), sinT = Math.sin(theta);
  const alpha = Math.PI / 2 - phi, cosA = Math.cos(alpha), sinA = Math.sin(alpha);
  const rotG = t * 0.0002 * 60 * .5;
  const cg = Math.cos(rotG), sg = Math.sin(rotG);
  const factor = 450 * (Math.min(W, H) / 800 > .5 ? Math.max(.7, Math.min(W, H) / 800) : .5);
  const cx = W / 2, cy = H / 2;

  ctx.globalCompositeOperation = "lighter";
  let ultimo = -1;
  for (let i = 0; i < N; i++) {
    const rx = px[i] * cg - pz[i] * sg, rz = px[i] * sg + pz[i] * cg;
    const x1 = rx * cosT - rz * sinT, z1 = rx * sinT + rz * cosT;
    const y2 = py[i] * cosA - z1 * sinA, z2 = py[i] * sinA + z1 * cosA;
    const prof = r - z2;
    if (prof < 1) continue;
    const sx = cx + x1 * factor / prof, sy = cy - y2 * factor / prof;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;

    const brillo = reducir ? .85 : .55 + .45 * Math.sin(t * vel[i] + fase[i]);
    const s = Math.max(1, tam[i] * 14 / prof * 1.4);
    ctx.globalAlpha = brillo;
    if (s > 2.2) {
      const g = s * 5;
      ctx.drawImage(sprites[col[i]], sx - g / 2, sy - g / 2, g, g);
    } else {
      if (col[i] !== ultimo) { const c = COLORES[col[i]]; ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; ultimo = col[i]; }
      ctx.fillRect(sx - s / 2, sy - s / 2, s, s);
    }
  }

  // Núcleo brillante que late
  const pulso = reducir ? 1 : 1 + .07 * Math.sin(t * 1.6);
  const rad = Math.max(10, 380 / r) * pulso;
  ctx.globalAlpha = 1;
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad * 6);
  g.addColorStop(0, "rgba(255,170,230,.45)"); g.addColorStop(.4, "rgba(190,130,255,.14)"); g.addColorStop(1, "rgba(190,130,255,0)");
  ctx.fillStyle = g; ctx.fillRect(cx - rad * 6, cy - rad * 6, rad * 12, rad * 12);
  g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
  g.addColorStop(0, "#ffffff"); g.addColorStop(.35, "#ffffff"); g.addColorStop(.7, "rgba(255,120,210,.9)"); g.addColorStop(1, "rgba(255,0,200,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.283); ctx.fill();

  // Estrellas fugaces
  ctx.globalCompositeOperation = "lighter";
  if (!reducir) {
    proxFugaz -= dt;
    if (proxFugaz <= 0) { nuevaFugaz(); proxFugaz = 3 + Math.random() * 4; }
  }
  for (let i = fugaces.length - 1; i >= 0; i--) {
    const f = fugaces[i];
    f.vida += dt; f.x += f.vx * dt; f.y += f.vy * dt;
    const k = f.vida / f.dur;
    if (k >= 1) { fugaces.splice(i, 1); continue; }
    const a = Math.sin(k * Math.PI);
    const gr = ctx.createLinearGradient(f.x, f.y, f.x - f.vx * .12, f.y - f.vy * .12);
    gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(1, "rgba(255,150,220,0)");
    ctx.strokeStyle = gr; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.vx * .12, f.y - f.vy * .12); ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
}
requestAnimationFrame(frame);

// Entrada suave
requestAnimationFrame(() => { cv.classList.add("listo"); document.body.classList.add("listo"); });
</script>
</body>
</html>
